# themes_mapping.yaml - how an article gets its theme (docs/CONTRACT.md section 4a and 6).
#
# Evidence order (first one that answers wins):
#   1. human (P31 = Q5): died <= 30 days before the reference time -> personnalites;
#      else first P106 occupation found in `occupations` below; else personnalites ("humain sans metier connu")
#   2. P31 (instance of) found in `wikidata`
#   2b. P31 found in `places` -> autres, source wikidata ("lieu géographique")
#   3. P31 found in `meta` (lists, disambiguation pages...) -> "autres" on purpose, source "inconnu"
#   4. P279 (subclass of), ONE level up, of a P31 found in `wikidata` (or `places`), except `generic_parents`
#   5. `keywords.<theme>.categories` matched on the Wikipedia categories of the article
#   6. `keywords.<theme>.texts` matched on title + edit comments + added texts (>= 2 hits)
#   7. otherwise "autres" with theme_source "inconnu". Nothing is guessed silently: every answer carries a reason.
#
# Every QID below was checked against the Wikidata API (wbgetentities); the comment after '#' is its
# English label. Re-check at any time with:  python -m radar_ingest.themes --verify
# Theme ids: catastrophes conflits politique sport personnalites culture science economie sante

