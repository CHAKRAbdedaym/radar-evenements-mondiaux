# ---------------------------------------------------------------- keyword fallbacks
# Used only when Wikidata gives nothing. Latin words match as whole words (plural s/es/x allowed);
# Arabic words match with optional prefix particles. Matching is case-insensitive.
# `categories`: matched on the Wikipedia category names (curated, fairly reliable, confidence 0.6).
# `texts`: matched on title + edit comments + added text (weak evidence, confidence 0.4, needs >= 2 hits;
# a hit in the title counts double), so only SPECIFIC words belong here. Generic words (technology,
# university, series, campaign...) were removed after checking real matches: a wrong theme is worse
# than "autres".
keywords:
  catastrophes:
    categories:
      en: [earthquake, flood, wildfire, tsunami, hurricane, typhoon, cyclone, tornado, landslide, "volcanic eruption", "plane crash", "air crash", "aviation accident", "railway accident", "train crash", shipwreck, "natural disaster", disaster, "building collapse", "mining accident", "road accident", "oil spill", famine, drought, "heat wave", stampede]
      fr: [séisme, "tremblement de terre", inondation, "feu de forêt", incendie, tsunami, ouragan, typhon, cyclone, tornade, "glissement de terrain", "éruption volcanique", "accident aérien", "accident ferroviaire", naufrage, "catastrophe naturelle", catastrophe, effondrement, "accident minier", "accident de la route", "marée noire", famine, sécheresse, canicule]
      ar: [زلزال, فيضان, "حرائق الغابات", تسونامي, إعصار, "ثوران بركان", "حادث طيران", "تحطم طائرة", "حادث قطار", غرق, كارثة, كوارث, مجاعة, جفاف, "موجة حر"]
    texts:
      en: [earthquake, tsunami, "death toll", wildfire, hurricane, typhoon, flooding, landslide, "plane crash", rescuers]
      fr: [séisme, "tremblement de terre", tsunami, "feux de forêt", ouragan, typhon, inondations, rescapés, secouristes]
      ar: [زلزال, تسونامي, "حصيلة الضحايا", "حرائق الغابات", إعصار, فيضانات, "تحطم طائرة"]
