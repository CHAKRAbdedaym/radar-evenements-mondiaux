# Radar frontend: static SPA + reverse proxy to the FastAPI backend.
server {
    listen 5173;
    listen [::]:5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS: re-resolve "backend" if its container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API -> backend. A variable without URI part forwards the raw request URI
    # unchanged (keeps %2F etc. inside URL-encoded article titles intact).
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # Hashed build assets: cache for a long time.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA fallback: every other path serves index.html (never cached).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
